AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  habit-tracker

  Sample SAM Template for habit-tracker

# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    Timeout: 30

    Tracing: Active
  Api:
    TracingEnabled: true
Resources:
  HabitTrackerFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      MemorySize: 512
      CodeUri: .
      Handler: src.infrastructure.aws.lambda_entry.lambda_handler
      Runtime: python3.13
      Architectures:
      - x86_64
      Events:
        HabitTracker:
          Type: HttpApi # More info about API Event Source: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#api
          Properties:
            Path: /{proxy+}
            Method: ANY
        HabitTrackerRoot:
          Type: HttpApi
          Properties:
            Path: /
            Method: ANY


Outputs:
  # ServerlessRestApi is an implicit API created out of Events key under Serverless::Function
  # Find out more about other implicit resources you can reference within SAM
  # https://github.com/awslabs/serverless-application-model/blob/master/docs/internals/generated_resources.rst#api
  HelloWorldApi:
    Description: API Gateway endpoint URL for Prod stage for Habit Tracker
      function
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/"
  HabitTrackerFunction:
    Description: Habit Tracker Lambda Function ARN
    Value: !GetAtt HabitTrackerFunction.Arn
  HabitTrackerFunctionIamRole:
    Description: Implicit IAM Role created for Habit Tracker function
    Value: !GetAtt HabitTrackerFunctionRole.Arn
