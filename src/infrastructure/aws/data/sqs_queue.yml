AWSTemplateFormatVersion: '2010-09-09'
Description: SQS Queue for Habit Reports
Transform: AWS::Serverless-2016-10-31

Resources:
  HabitReportQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 345600
      QueueName: habit-reports-queue
      ReceiveMessageWaitTimeSeconds: 20
      Tags:
        - Key: Project
          Value: habit-tracker
        - Key: Environment
          Value: Dev
      VisibilityTimeout: 120
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt HabitReportDLQ.Arn
        maxReceiveCount: 3
  HabitReportDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: habit-reports-dlq
      MessageRetentionPeriod: 1209600

  HabitReportAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Alarm for Habit Report Generation Failures
      MetricName: ReportGenerationFailures
      Namespace: HabitTracker
      Statistic: Sum
      EvaluationPeriods:  1
      Period:  300
      ComparisonOperator:  GreaterThanOrEqualToThreshold
      Threshold: 1
      TreatMissingData:  notBreaching

Outputs:
  ReportQueueUrl:
    Value: !Ref HabitReportQueue
    Export:
      Name: !Sub "${AWS::StackName}-ReportQueueUrl"
  ReportQueueArn:
    Value: !GetAtt HabitReportQueue.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ReportQueueArn"
  ReportQueueName:
    Value: !GetAtt HabitReportQueue.QueueName
    Export:
      Name: !Sub "${AWS::StackName}-ReportQueueName"
  HabitReportAlarmName:
    Value: !Ref HabitReportAlarm
